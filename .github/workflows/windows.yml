name: Windows build and production checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:eval
      - run: npm run test:ui
      - run: npm run build:win
      - run: npm run test:production -- --packaged
      - run: npm run test:latency -- --packaged
      - run: node scripts/verify-realtime.cjs --packaged
      - run: node scripts/verify-profile-restore.cjs --packaged
      - run: npm run test:hardening -- --packaged
      - run: npm run test:desktop -- --packaged
      - run: node scripts/verify-portable.cjs
      - run: node scripts/verify-installer.cjs
      - run: npm run test:install-lifecycle -- --disposable-host
      - run: node scripts/verify-release-safety.cjs
      - run: npm run release:source
      - run: node scripts/check-release.cjs
      - run: npm run release:inventory
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-and-source
          path: |
            dist/*-portable.exe
            dist/*-setup.exe
            dist/*-source.zip
            dist/SHA256SUMS.txt
            dist/release-manifest.json
            dist/dependency-inventory.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: synthetic-check-reports
          path: |
            test-results/production-*/report.json
            test-results/hardening-packaged.json
            test-results/ui-*/report.json
            test-results/latency-*/report.json
            test-results/realtime-*/report.json
            test-results/realtime-*/diagnostics.json
            test-results/profile-restore-*/report.json
            test-results/installer-*/report.json
            test-results/install-lifecycle-*/report.json
            test-results/portable-*/report.json
          if-no-files-found: ignore

  restricted-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node -e "require('node:child_process').execFileSync('docker',['pull',require('./evals/sandbox-image.json').image],{stdio:'inherit'})"
      - run: npm run test:eval-sandbox

  publish-verified-070:
    name: Publish verified v0.7.0 artifacts
    if: github.event_name == 'workflow_dispatch' && github.repository == 'AYASKA-in/parakeet-rea-studio' && github.ref == 'refs/heads/codex/release-0.7.0'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8054f1330a013a423edd6fb7edb5d3c0e456bf70
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Verify exact successful build and publish matching unsigned artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          (function publishVerifiedRelease(){
           const fs=require('node:fs'),crypto=require('node:crypto'),{execFileSync}=require('node:child_process'),assert=require('node:assert/strict');
           const revision='8054f1330a013a423edd6fb7edb5d3c0e456bf70',runId='39582619004',repo='AYASKA-in/parakeet-rea-studio',tag='v0.7.0';
           const gh=args=>execFileSync('gh',args,{encoding:'utf8',maxBuffer:4*1024*1024,stdio:['ignore','pipe','pipe']});
           assert.equal(process.env.GITHUB_REPOSITORY,repo);
           const run=JSON.parse(gh(['run','view',runId,'--repo',repo,'--json','headSha,conclusion']));
           assert.equal(run.headSha,revision);assert.equal(run.conclusion,'success');assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),revision);
           gh(['run','download',runId,'--repo',repo,'--name','windows-and-source','--dir','dist']);
           execFileSync(process.execPath,['scripts/check-release.cjs'],{stdio:'inherit',windowsHide:true});
           const names=['Parakeet-Studio-0.7.0-portable.exe','Parakeet-Studio-0.7.0-setup.exe','Parakeet-Studio-0.7.0-source.zip','SHA256SUMS.txt','release-manifest.json','dependency-inventory.json'];
           const hash=file=>crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
           const hashes=Object.fromEntries(names.map(name=>[name,{digest:'sha256:'+hash('dist/'+name),size:fs.statSync('dist/'+name).size}]));
           let notes=fs.readFileSync('docs/RELEASE_NOTES_0.7.0.md','utf8').replace(/\]\(([A-Z_]+\.md)\)/g,(_,file)=>'](https://github.com/'+repo+'/blob/'+tag+'/docs/'+file+')');
           notes+='\n## Build provenance\n\nBuilt from commit `'+revision+'`. [Release CI](https://github.com/'+repo+'/actions/runs/'+runId+') passed Windows verification and restricted evaluation, including 120 deterministic tests and the disposable Windows installer lifecycle. These portable/setup EXEs are **unsigned**. No shared API key is included.\n';
           const notesFile=process.env.RUNNER_TEMP+'/parakeet-0.7.0-notes.md';fs.writeFileSync(notesFile,notes);
           const releasesEndpoint='repos/'+repo+'/releases';
           let draft=JSON.parse(gh(['api',releasesEndpoint+'?per_page=100'])).find(row=>row.tag_name===tag);
           if(!draft){gh(['release','create',tag,'--repo',repo,'--target',revision,'--title','Parakeet Studio 0.7.0 — Experimental Windows (unsigned)','--notes-file',notesFile,'--draft','--prerelease',...names.map(name=>'dist/'+name)]);draft=JSON.parse(gh(['api',releasesEndpoint+'?per_page=100'])).find(row=>row.tag_name===tag);}
           assert.ok(draft,'Release draft not found');assert.equal(draft.target_commitish,revision);assert.equal(draft.prerelease,true);assert.equal(draft.assets.length,names.length);
           for(const name of names){const asset=draft.assets.find(x=>x.name===name);assert.ok(asset,'Missing uploaded asset: '+name);assert.equal(asset.size,hashes[name].size);assert.equal(asset.digest,hashes[name].digest,'Uploaded digest differs: '+name);}
           if(draft.draft)gh(['api',releasesEndpoint+'/'+draft.id,'--method','PATCH','-F','draft=false','-F','prerelease=true']);
           const published=JSON.parse(gh(['api',releasesEndpoint+'/'+draft.id]));assert.equal(published.draft,false);assert.equal(published.prerelease,true);
           const ref=JSON.parse(gh(['api','repos/'+repo+'/git/ref/tags/'+tag]));assert.equal(ref.object.type,'commit');assert.equal(ref.object.sha,revision);
           console.log(JSON.stringify({release:published.html_url,sourceRevision:revision,unsigned:true,uploadedDigestsVerified:true,assets:published.assets.map(a=>({name:a.name,size:a.size,digest:a.digest,url:a.browser_download_url}))},null,2));
          })();
          '@ | node
