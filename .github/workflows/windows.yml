name: Windows build and core checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:win
      - run: npm run release:source
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-and-source
          path: |
            dist/*-portable.exe
            dist/*-source.zip
            dist/SHA256SUMS.txt
            dist/release-manifest.json
