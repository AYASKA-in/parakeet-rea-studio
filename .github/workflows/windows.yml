name: Windows build and production checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:eval
      - run: npm run test:ui
      - run: npm run build:win
      - run: npm run test:production -- --packaged
      - run: npm run test:hardening -- --packaged
      - run: npm run test:desktop -- --packaged
      - run: node scripts/verify-portable.cjs
      - run: npm run release:source
      - run: node scripts/check-release.cjs
      - run: npm run release:inventory
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-and-source
          path: |
            dist/*-portable.exe
            dist/*-source.zip
            dist/SHA256SUMS.txt
            dist/release-manifest.json
            dist/dependency-inventory.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: synthetic-check-reports
          path: |
            test-results/production-*/report.json
            test-results/hardening-packaged.json
            test-results/ui-*/report.json
          if-no-files-found: ignore
